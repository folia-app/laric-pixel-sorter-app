[build]
  functions = "functions"

# proxy rinkeby server media
[[redirects]]
  from = "/gif/*"
  to = "http://164.92.233.6:3001/gif/:splat"
  status = 200

# rinkeby server proxy
[[redirects]]
  from = "/api/4/*"
  to = "http://164.92.233.6:3001/:splat"
  status = 200

# rinkeby tokenURI proxy
[[redirects]]
  from = "/v1/metadata/*"
  to = "http://164.92.233.6:3001/v1/metadata/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200